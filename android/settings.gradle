// android/settings.gradle

// 1) pluginManagement must appear first
pluginManagement {
    repositories {
        gradlePluginPortal()
        google()
        mavenCentral()
    }

    // declare plugin coordinates for the plugins { } DSL in module build files
    plugins {
        id "com.android.application" version "8.9.1" apply false
        id "org.jetbrains.kotlin.android" version "2.1.0" apply false
        id "com.google.gms.google-services" version "4.3.15" apply false
        id "dev.flutter.flutter-plugin-loader" version "1.0.0" apply false
    }
}

// 2) Read local.properties early so we can add the Flutter engine local Maven repo
def localPropertiesFile = new File(rootDir, "local.properties")
if (!localPropertiesFile.exists()) {
    throw new GradleException("local.properties not found. Run 'flutter pub get' from project root to generate it.")
}
def Properties localProps = new Properties()
localPropertiesFile.withReader('UTF-8') { reader -> localProps.load(reader) }
def flutterRoot = localProps.getProperty('flutter.sdk')
if (flutterRoot == null) {
    throw new GradleException("flutter.sdk not set in local.properties")
}

// Path to Flutter engine artifacts inside the Flutter SDK (local maven repo)
def flutterEngineRepo = file("${flutterRoot}/bin/cache/artifacts/engine/android")
def flutterCommonRepo = file("${flutterRoot}/bin/cache/artifacts/engine/common")

// 3) dependencyResolutionManagement - prefer settings but allow project repos when plugins need them
dependencyResolutionManagement {
    // prefer settings repositories but allow project repositories if plugin adds them
    repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
    repositories {
        google()
        mavenCentral()

        // Local Flutter engine artifacts (AARs). Add only if directory exists.
        if (flutterEngineRepo.exists()) {
            maven {
                url = uri(flutterEngineRepo)
            }
        }

        // Some Flutter engine artifacts are in 'common' directory; add if present.
        if (flutterCommonRepo.exists()) {
            maven {
                url = uri(flutterCommonRepo)
            }
        }
    }
}

rootProject.name = "multi_detection_system"
include ":app"

// 4) include Flutter tooling build so Flutter tasks are available
includeBuild("${flutterRoot}/packages/flutter_tools/gradle")
