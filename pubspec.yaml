name: multi_detection_system
description: AI model for multi detection such as fake news, malicious URLs, AI images, and fake audio
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  provider: ^6.1.1

  # HTTP & API
  http: ^1.2.0
  google_generative_ai: ^0.4.7

  # Storage
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0

  # UI Components
  cupertino_icons: ^1.0.6
  image_picker: ^1.0.7
  file_picker: ^10.3.6

  # Utilities
  path_provider: ^2.1.2
  mime: ^2.0.0
  intl: ^0.20.2
  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  firebase_auth_web: ^6.1.0
  cloud_firestore: ^6.1.0
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icon/app_icon.png   # ensure icon exists here

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700

flutter_icons:
  android: true
  ios: true
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#000000"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
